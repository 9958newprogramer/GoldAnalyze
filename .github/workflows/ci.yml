name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AURUMLAB_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Run lint, tests, Redis integration, Agent eval, and contract drift gates
        run: make verify

  java-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Java control-plane tests
        run: ./mvnw --batch-mode test

  container-smoke:
    needs: [verify, java-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build non-root application image
        run: docker build --tag aurumlab:1.0.0 .

      - name: Start full stack and wait for health checks
        run: docker compose up -d --no-build --wait

      - name: Verify API, Worker, and offline Agent evidence
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8010/api/health
          docker compose exec -T api python scripts/demo_resume.py \
            --skip-eval --output /tmp/resume-evidence.json

      - name: Collect diagnostics after failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
