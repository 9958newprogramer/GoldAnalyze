[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurumlab"
version = "0.6.0"
description = "Multi-Skill agent runtime with bounded plans, governed MCP tools, and evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "mcp>=2.1,<3",
  "openai>=2,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
aurumlab = "app.main:run"
aurumlab-mcp = "app.mcp_server:main"
aurumlab-mcp-tools = "app.mcp_provider:main"
aurumlab-eval = "app.evals.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
